name: Build AirSane for ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 container
        run: |
          docker run --rm -v ${{ github.workspace }}:/out --platform linux/arm64 debian:trixie bash -c "
            apt update && apt install -y libsane-dev libjpeg-dev libpng-dev libavahi-client-dev libusb-1.0-0-dev git cmake g++ &&
            git clone https://github.com/SimulPiscator/AirSane.git /src &&
            mkdir /src-build && cd /src-build &&
            cmake /src -DCMAKE_BUILD_TYPE=Release &&
            make -j4 &&
            cp airsaned /out/
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: airsaned-arm64
          path: airsaned
